services:
  postgres:
    image: postgres:16
    container_name: dofus-raid-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dofusraid}
      POSTGRES_USER: ${POSTGRES_USER:-dofus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dofus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dofus} -d ${POSTGRES_DB:-dofusraid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backend / frontend ne demarrent qu'avec le profil "full" :
  #   docker compose --profile full up -d --build
  # `docker compose up -d` (sans profil) ne lance que postgres.
  backend:
    build: ./backend
    container_name: dofus-raid-backend
    profiles: ["full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dofusraid}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dofus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dofus}
      # Le front est servi en meme origine (proxy nginx), le CORS n'est donc plus
      # sollicite en local ; on garde la valeur configurable par coherence.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dofus-raid-frontend
    profiles: ["full"]
    # Le navigateur appelle /api en meme origine (http://localhost:5173) ; nginx
    # proxifie ces requetes vers le backend via le reseau interne compose.
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
