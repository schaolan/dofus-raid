spring:
  application:
    name: dofus-raid-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dofusraid}
    username: ${SPRING_DATASOURCE_USERNAME:dofus}
    password: ${SPRING_DATASOURCE_PASSWORD:dofus}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  cache:
    type: caffeine
    cache-names: guilds,guildById
    caffeine:
      # Les guildes sont des donnees de reference quasi statiques : on peut garder longtemps.
      spec: maximumSize=500,expireAfterWrite=1h

server:
  port: 8080

app:
  cors:
    # Origines autorisees, separees par des virgules (ex. https://front.example.com).
    # En prod avec le proxy nginx same-origin, le CORS n'est pas sollicite ; on garde
    # la valeur configurable pour rester robuste si le front est servi ailleurs.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
