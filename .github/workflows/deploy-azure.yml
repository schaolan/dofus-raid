name: deploy-azure

# Provisionne l'infra et deploie backend + frontend sur Azure via azd.
# Declenchement manuel, ou automatique sur push main.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Authentification OIDC (aucun secret de mot de passe cote GitHub).
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets a definir dans le repo (Settings > Secrets and variables > Actions) :
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Mot de passe admin PostgreSQL (secret) consomme par main.parameters.json.
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      # Variables (Settings > Variables) : nom d'environnement et region azd.
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Log in with azd (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy services
        run: azd deploy --no-prompt
