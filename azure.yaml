# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Configuration Azure Developer CLI (azd).
# Deploiement : `azd auth login` puis `azd up`.
name: dofus-raid
metadata:
  template: dofus-raid@1.0.0

# Les services sont mappes aux Container Apps via le tag `azd-service-name`
# defini dans infra/main.bicep.
services:
  backend:
    project: ./backend
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  frontend:
    project: ./frontend
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Pas de buildArgs : le Dockerfile declare deja `ARG VITE_API_URL=""` (chaine
      # vide), donc le front est construit en relatif same-origin et nginx proxifie
      # /api vers le backend.
      #
      # Ne PAS reintroduire `buildArgs: [VITE_API_URL=""]` : en YAML les guillemets
      # ne sont pas en debut de scalaire, ils font donc partie de la valeur. Docker
      # recoit deux guillemets litteraux, le bundle embarque API_URL = '""' et le
      # navigateur appelle /""/api/raids -- que le fallback SPA de nginx sert en
      # 200 + index.html (echec invisible dans l'onglet Network).
